name: Build and Push to ECR

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "alembic/**"
      - "alembic.ini"
      - "scripts/**"
      - "!scripts/infra/**"
      - "data/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "frontend/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: movie-review-ci-main
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/movie-review-backend:latest
            ${{ steps.login-ecr.outputs.registry }}/movie-review-backend:${{ github.sha }}

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/movie-review-frontend:latest
            ${{ steps.login-ecr.outputs.registry }}/movie-review-frontend:${{ github.sha }}

      - name: Update GitOps image digests
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          for app in ("backend", "frontend"):
              digest = os.environ[f"{app.upper()}_DIGEST"]
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  raise SystemExit(f"Invalid digest for {app}")

              path = Path(f"k8s/gitops/movie-app/deployment-{app}.json")
              data = json.loads(path.read_text())
              container = next(
                  c for c in data["spec"]["template"]["spec"]["containers"]
                  if c["name"] == app
              )
              container["image"] = (
                  f"{os.environ['ECR_REGISTRY']}/movie-review-{app}@{digest}"
              )
              path.write_text(json.dumps(data, indent=2) + "\n")
              print(f"Updated {app}: {digest}")
          PY

      - name: Commit and push GitOps update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            k8s/gitops/movie-app/deployment-backend.json \
            k8s/gitops/movie-app/deployment-frontend.json

          if git diff --cached --quiet; then
            echo "Image digests unchanged."
            exit 0
          fi

          git commit -m "Deploy images from ${GITHUB_SHA}"
          git push origin HEAD:main
