apiVersion: v1
kind: Pod
metadata:
  name: recovery-probe
  namespace: node-recovery
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: k3d-rancher-lab-agent-0
  containers:
    - name: probe
      image: busybox:1.37
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
            if response=$(wget -q -T 2 -O - http://recovery-web.node-recovery.svc.cluster.local/ 2>&1); then
              printf '%s OK %s\n' "$timestamp" "$response"
            else
              printf '%s FAIL %s\n' "$timestamp" "$response"
            fi
            sleep 1
          done
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
