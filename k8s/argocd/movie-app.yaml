apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: movie-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/httpJun/movie-review-devops.git
    targetRevision: main
    path: k8s/gitops/movie-app
  destination:
    server: https://kubernetes.default.svc
    namespace: movie-app
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
