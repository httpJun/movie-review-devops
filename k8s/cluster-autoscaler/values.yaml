cloudProvider: aws
awsRegion: ap-northeast-2

autoDiscovery:
  clusterName: movie-review-eks

rbac:
  create: true
  serviceAccount:
    create: true
    name: cluster-autoscaler

replicaCount: 1

extraArgs:
  v: "4"
  stderrthreshold: info
  expander: least-waste
  scale-down-delay-after-add: 10m
  scale-down-unneeded-time: 10m

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    memory: 600Mi
