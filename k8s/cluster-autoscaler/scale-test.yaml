apiVersion: v1
kind: Namespace
metadata:
  name: autoscaler-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-test
  namespace: autoscaler-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capacity-test
  template:
    metadata:
      labels:
        app: capacity-test
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: movie-review
      containers:
        - name: sleeper
          image: busybox:1.37
          command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: "1"
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 64Mi
