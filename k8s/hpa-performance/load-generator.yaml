apiVersion: v1
kind: Pod
metadata:
  name: hpa-load-generator
  namespace: backup-lab
spec:
  containers:
    - name: k6
      image: grafana/k6:1.0.0
      command: ["/bin/sh", "-c", "sleep 86400"]
      resources:
        requests:
          cpu: 250m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi
      volumeMounts:
        - name: test-script
          mountPath: /scripts
          readOnly: true
  volumes:
    - name: test-script
      configMap:
        name: hpa-load-test
