apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-backend
  namespace: backup-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-backend
  template:
    metadata:
      labels:
        app: hpa-backend
    spec:
      containers:
        - name: backend
          image: movie-review-backend:hpa-lab
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: hpa-backend-secret
          env:
            - name: SCHEDULER_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: hpa-backend
  namespace: backup-lab
spec:
  selector:
    app: hpa-backend
  ports:
    - port: 8000
      targetPort: 8000
