[project]
name = "capstone"
version = "0.1.0"
description = "capstone design"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "apscheduler>=3.10",
    "beautifulsoup4>=4.13",
    "fastapi>=0.135.2",
    "hdbscan>=0.8.41",
    "numpy>=2.4.3",
    "openai>=2.30.0",
    "playwright>=1.45",
    "psycopg>=3.3.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.3.0",
    "torch",
    "sqlalchemy>=2.0.49",
    "streamlit>=1.55.0",
    "uvicorn>=0.42.0",
]
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
