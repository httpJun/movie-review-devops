services:

  db:
    image: postgres:16
    container_name: movie-postgres

    environment:
      POSTGRES_DB: movie
      POSTGRES_USER: movie
      POSTGRES_PASSWORD: moviepassword

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie -d movie"]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: movie-backend

    environment:
      DATABASE_URL: postgresql+psycopg://movie:moviepassword@db:5432/movie
      KOBIS_API_KEY: f20cb59829a283f34326d23b7ae1c0b5
      OPENAI_API_KEY : ${OPENAI_API_KEY}
      SCHEDULER_ENABLED: "false"

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: movie-frontend

    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      API_BASE_URL: http://backend:8000

    ports:
      - "3000:3000"

    depends_on:
      - backend


volumes:
  postgres_data:
